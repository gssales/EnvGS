configs:
    - configs/datasets/nerf_synthetic/nerf_synthetic.yaml

dataloader_cfg: # we see the term "dataloader" as one word?
    dataset_cfg: &dataset_cfg
        data_root: /mnt/data/easyvolcap/nerf_synthetic/ship/train
        near: 2.0
        far: 6.0
        use_aligned_cameras: False
        view_sample: [0, null, 1] 

val_dataloader_cfg:
    dataset_cfg:
        data_root: /mnt/data/easyvolcap/nerf_synthetic/ship/test
        view_sample: [0, null, 1] 

model_cfg:
    sampler_cfg:
        preload_gs: /mnt/data/easyvolcap/nerf_synthetic/ship/points/pcds/points3d.ply
        spatial_scale: 5.202147674560547
        # Environment Gaussian
        env_preload_gs: /mnt/data/easyvolcap/nerf_synthetic/ship/points/envs/points3d.ply
        env_bounds: [[-50.0, -50.0, -50.0], [50.0, 50.0, 50.0]]

